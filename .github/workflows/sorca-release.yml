name: Orca 每日同步与发布

on:
  schedule:
    - cron: '0 13 * * *' # 21:00 Asia/Shanghai

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/sorca-build.yml
    with:
      sync_upstream: true
      publish_after_build: true
    secrets:
      SORCA_MAC_CERTS: ${{ secrets.SORCA_MAC_CERTS }}
      SORCA_MAC_CERTS_PASSWORD: ${{ secrets.SORCA_MAC_CERTS_PASSWORD }}
