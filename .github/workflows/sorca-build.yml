name: Orca 构建与发布
run-name: Orca ${{ inputs.platforms || 'both' }} · ${{ github.event_name }}

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: both
      sync_upstream:
        type: boolean
        default: false
      publish_after_build:
        type: boolean
        default: false
      mac_runner:
        type: string
        default: xcode-27
      expected_commit:
        type: string
    secrets:
      SORCA_MAC_CERTS:
        required: false
      SORCA_MAC_CERTS_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      platforms:
        description: 构建平台
        type: choice
        options:
          - both
          - mac
          - windows
          - windows-qa
        default: both
      sync_upstream:
        description: 同步上游最新稳定安装包对应的提交，并跳过已有成品的版本
        type: boolean
        default: false
      publish_after_build:
        description: 发布双平台成品到 GitHub Releases
        type: boolean
        default: false
      mac_runner:
        description: 手动构建时选择 Mac 运行器
        type: choice
        options:
          - xcode-27
          - macos-26
        default: xcode-27
      expected_commit:
        description: 指定已验证的自用版提交
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: orca-distribution-${{ inputs.platforms == 'windows-qa' && 'qa' || 'release' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'UnityX103/orca' && github.ref == 'refs/heads/自用版'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      build: ${{ steps.source.outputs.build }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.source.outputs.matrix }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 自用版
          fetch-depth: 0
      - name: 同步上游并确定构建提交
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_UPSTREAM: ${{ inputs.sync_upstream }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          PUBLISH_AFTER_BUILD: ${{ inputs.publish_after_build }}
          MAC_RUNNER: ${{ inputs.mac_runner || 'xcode-27' }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SORCA_MAC_SIGNING_SHA1: ${{ vars.SORCA_MAC_SIGNING_SHA1 }}
          SORCA_MAC_SIGNING_SECRETS_PRESENT: ${{ secrets.SORCA_MAC_CERTS != '' && secrets.SORCA_MAC_CERTS_PASSWORD != '' }}
        shell: bash
        run: bash config/scripts/release/publication/prepare-orca-distribution.sh

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_LOCAL_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      ORCA_BUILD_COMMIT: ${{ needs.prepare.outputs.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: 安装依赖
        shell: bash
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-mobile-dependencies
      - name: 验证 BoBot、CNB 和旧版数据兼容
        shell: bash
        run: pnpm test src/main/bobot/bobot-environment.test.ts src/main/cnb/repository-ref.test.ts src/main/updater/releases/sorca-release-feed.test.ts sorca-profile-location.test.ts --maxWorkers=2
      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:release
          pnpm ensure:electron-runtime
      - name: 打包并核验 macOS 签名
        if: matrix.platform == 'mac'
        shell: bash
        env:
          SORCA_MAC_SIGNING_SHA1: ${{ inputs.publish_after_build && vars.SORCA_MAC_SIGNING_SHA1 || '' }}
          SORCA_MAC_CERTS: ${{ inputs.publish_after_build && secrets.SORCA_MAC_CERTS || '' }}
          SORCA_MAC_CERTS_PASSWORD: ${{ inputs.publish_after_build && secrets.SORCA_MAC_CERTS_PASSWORD || '' }}
        run: bash config/scripts/desktop-distribution/macos/package-sorca-release.sh
      - name: 打包 Windows
        if: matrix.platform != 'mac'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ASSET: ${{ matrix.asset }}
          SORCA_WINDOWS_QA: ${{ matrix.platform == 'windows-qa' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == windows-qa ]]; then
            target=(--win --dir --x64)
          else
            target=(--win nsis --x64)
          fi
          pnpm exec electron-builder --config config/electron-builder.orca-distribution.config.cjs "${target[@]}" --publish never
          if [[ "$PLATFORM" == windows-qa ]]; then
            test -s "dist/$ASSET/OrcaQA.exe"
            printf '%s\n' "$ORCA_BUILD_COMMIT" > "dist/$ASSET/orca-source-commit.txt"
          elif [[ ! -s "dist/$ASSET" ]]; then
            echo "::error::Expected installer file dist/$ASSET is missing or empty."
            exit 1
          fi
      - name: 验证 Windows 成品 CLI
        if: matrix.platform == 'windows' || matrix.platform == 'windows-qa'
        run: node config/scripts/desktop-distribution/runtime-verification/smoke-packaged-cli.mjs --app-dir=dist/win-unpacked
      - name: 验证成品默认数据标识
        if: matrix.platform != 'windows-qa'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == mac ]]; then
            archive='dist/mac-arm64/Orca.app/Contents/Resources/app.asar'
          else
            archive='dist/win-unpacked/resources/app.asar'
          fi
          node - "$archive" <<'NODE'
          const assert = require('node:assert/strict')
          const { createRequire } = require('node:module')
          const builderRequire = createRequire(require.resolve('app-builder-lib'))
          const { extractFile } = builderRequire('@electron/asar')
          const metadata = JSON.parse(extractFile(process.argv[2], 'package.json'))
          assert.equal(metadata.version, process.env.ORCA_LOCAL_BUILD_VERSION)
          assert.equal(metadata.productName ?? metadata.name, 'orca', 'The packaged default must match the Orca profile')
          assert.equal(metadata.name, 'orca', 'NSIS must reuse the original Orca program directory')
          NODE
      - name: 验证 Windows 静默原址升级与旧版数据保留
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $stock = Join-Path $programs 'orca'
          $installed = Join-Path $stock 'Orca.exe'
          $profileMarkers = foreach ($profileName in @('orca', 'SOrca')) {
            $directory = Join-Path $env:APPDATA $profileName
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $file = Join-Path $directory "sorca-upgrade-probe-$env:GITHUB_RUN_ID.txt"
            Set-Content -LiteralPath $file -Value $profileName
            @{ Path = $file; Content = $profileName }
          }

          $previous = Join-Path $env:RUNNER_TEMP 'sorca-previous-release'
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or $published.prerelease) {
            throw 'Could not resolve the previous production release.'
          }
          $oldAsset = $published.assets | Where-Object name -eq $env:ASSET
          gh release download $published.tag_name --repo $env:GITHUB_REPOSITORY --dir $previous --pattern $env:ASSET
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous installer.' }
          $oldInstaller = Join-Path $previous $env:ASSET
          $oldDigest = (Get-FileHash -LiteralPath $oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldAsset.digest -cne "sha256:$oldDigest") { throw 'Previous installer digest mismatch.' }
          $first = Start-Process -FilePath $oldInstaller -ArgumentList '/S' -Wait -PassThru
          $cli = Join-Path $stock 'resources/bin/orca.exe'
          if ($first.ExitCode -ne 0 -or !(Test-Path -LiteralPath $installed -PathType Leaf) -or
              (& $cli --version) -cne $published.tag_name.Substring(1)) {
            throw 'The previous installer did not install the expected Orca build.'
          }

          node --import tsx config/scripts/desktop-distribution/runtime-verification/smoke-sorca-windows-upgrade.mjs `
            (Join-Path 'dist' $env:ASSET) $installed $published.tag_name.Substring(1) $env:ORCA_LOCAL_BUILD_VERSION
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $installed -PathType Leaf) -or
              (& $cli --version) -cne $env:ORCA_LOCAL_BUILD_VERSION) {
            throw 'Silent upgrade did not replace the existing Orca installation.'
          }
          foreach ($profileMarker in $profileMarkers) {
            if (!(Test-Path -LiteralPath $profileMarker.Path) -or (Get-Content -LiteralPath $profileMarker.Path) -cne $profileMarker.Content) {
              throw "Orca changed existing data at $($profileMarker.Path)."
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: orca-${{ matrix.platform }}
          path: |
            dist/${{ matrix.asset }}
            ${{ matrix.platform == 'mac' && 'dist/orca-macos-arm64-update.json' || '' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: orca-*
          path: release
          merge-multiple: true
      - name: 上传成品并发布
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/自用版 | cut -f1)"
          if [[ "$head_sha" != "$SOURCE_SHA" ]]; then
            echo '::error::自用版分支已前进，请为新的提交运行构建。'
            exit 1
          fi
          tag="v$VERSION"
          cd release
          mapfile -t assets < <(jq -r '.[].asset' <<< "$MATRIX")
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          marker=orca-macos-arm64-update.json
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          test -s "$marker"
          identity=$(jq -er --arg version "$VERSION" '
            select(.version == $version) | .signingIdentity | select(test("^[a-f0-9]{64}$"))
          ' "$marker")
          assets+=("$marker")
          if jq -e --arg marker "$marker" 'any(.assets[]; .name == $marker and .state == "uploaded")' \
            <<< "$latest" >/dev/null; then
            previous_tag=$(jq -er '.tag_name' <<< "$latest")
            previous_identity=$(gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$marker" --output - | jq -er '.signingIdentity | select(test("^[a-f0-9]{64}$"))')
            if [[ "$identity" != "$previous_identity" ]]; then
              echo '::error::macOS 签名身份与上次发布不一致，已停止发布。'
              exit 1
            fi
          fi
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null)"; then
            jq -e --arg sha "$SOURCE_SHA" '.isDraft and .targetCommitish == $sha' <<< "$existing" >/dev/null
          else
            {
              printf '构建提交 %s\n\n' "$SOURCE_SHA"
              printf '[GitHub Actions 构建记录](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > release-notes.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --draft --title "Orca $VERSION" --notes-file release-notes.md
          fi
          gh release upload "$tag" "${assets[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
